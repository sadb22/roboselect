{% extends 'workflow/base.html' %}{% load workflow_tags %}{% block content %}<div class="card compact"><h1>Аккаунт</h1>{% if user.is_authenticated %}<p>Вы вошли как {{ user.username }}.</p><button id="logout">Выйти</button>{% else %}<form id="auth">{% csrf_token %}<label>Имя пользователя<input name="username" required maxlength="80" autocomplete="username"></label><label>Пароль<input name="password" type="password" required minlength="10" autocomplete="current-password"></label><p class="muted">Для нового аккаунта используйте пароль от 10 символов.</p><p id="auth-error" class="error" role="alert"></p><button name="mode" value="login">Войти</button> <button name="mode" value="register" class="secondary">Зарегистрироваться</button></form>{% endif %}</div>{% endblock %}
