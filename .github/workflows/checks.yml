name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core workflow --verbosity 2
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_data
      - run: python scripts/verify_release.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roboscope
          POSTGRES_USER: roboscope
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roboscope -d roboscope"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://roboscope:ci-test-only@127.0.0.1:5432/roboscope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py collectstatic --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py test core workflow --verbosity 2
      - run: python manage.py seed_data
      - run: python scripts/verify_release.py
