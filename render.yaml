services:
  - type: web
    name: roboscope
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/render_start.py
    healthCheckPath: /health/
    envVars:
      - key: PASSWORDLESS_DEMO
        value: "1"
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: roboscope-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
databases:
  - name: roboscope-db
    plan: free
    region: frankfurt
    databaseName: roboscope
    user: roboscope
    ipAllowList: []
